---
features:
  - |
    ``recover_configurations`` now performs its per-bitstring correction in
    parallel when the consumer compiles with OpenMP enabled.  The library
    remains header-only and depends only on the C++ standard library; the
    parallel path is guarded by ``_OPENMP`` and the serial behavior is used
    otherwise.
  - |
    Under OpenMP, the random number generator is used to seed independent
    per-work-item streams rather than being drawn from sequentially.  A
    counter-based engine (one with ``set_counter``, such as the C++26
    ``std::philox_engine``) is keyed by bitstring index, so the result is
    identical for any number of threads; any other engine must be seedable and
    is copied per thread, giving results that are valid but depend on the thread
    count.  A generator that is neither counter-based nor seedable is rejected at
    compile time under OpenMP but remains usable in a serial build.
upgrade:
  - |
    The numerical output of ``recover_configurations`` for a given seeded
    generator has changed.  The returned unique bitstrings are now emitted in
    first-seen (input) order rather than an unspecified order, and when built
    with OpenMP the correction draws randomness via per-work-item streams.  The
    returned distribution remains a valid refinement; only the specific
    bitstrings selected and their ordering may differ from previous releases.
