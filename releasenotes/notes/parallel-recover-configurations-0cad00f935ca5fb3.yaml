---
features:
  - |
    ``recover_configurations`` now performs its per-bitstring correction in
    parallel when the consumer compiles with OpenMP enabled.  The library
    remains header-only and depends only on the C++ standard library; the
    parallel path is guarded by ``_OPENMP`` and the serial behavior is used
    otherwise.
  - |
    Under OpenMP, the random number generator is used to seed independent
    per-work-item streams rather than being drawn from sequentially.  A
    counter-based engine -- one whose ``set_counter`` accepts its counter type,
    such as the C++26 `std::philox_engine
    <https://en.cppreference.com/w/cpp/numeric/random/philox_engine>`__ -- is
    keyed by bitstring index, so the result is identical for any number of
    threads *and* identical to a serial build, since the serial path keys items
    the same way.  Any other engine must be seedable and is copied per thread; its
    results are valid, agree with a serial build when OpenMP runs on one thread,
    and depend on the thread count beyond that.  A generator that is neither
    counter-based nor seedable is rejected at compile time under OpenMP but
    remains usable in a serial build.

    The counter-based tier is not specific to ``std::philox_engine``.  An engine
    qualifies by naming a counter type -- either a nested ``counter_type``, or a
    static ``word_count`` from which the standard
    ``std::array<result_type, word_count>`` shape is derived -- and accepting it
    in ``set_counter``.  See :doc:`random-number-generation` for the
    reproducibility guarantees of each tier.
upgrade:
  - |
    The numerical output of ``recover_configurations`` for a given seeded
    generator has changed.  The returned unique bitstrings are now emitted in
    first-seen (input) order rather than an unspecified order, and the correction
    draws randomness via per-work-item streams with a counter-based generator in
    every build.  With any other generator the serial path now seeds the
    generator once before the loop, as an OpenMP build does for its first thread,
    so the two agree on one thread.  The
    returned distribution remains a valid refinement; only the specific
    bitstrings selected and their ordering may differ from previous releases.
