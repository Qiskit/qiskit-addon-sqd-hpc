name: Coverage

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'

jobs:
  coverage:
    name: C++ coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build
      - name: Install gcovr
        run: |
          python -m pip install --upgrade pip
          # gcovr 8.4 miscounts lines in headers/templates, and 8.3 and
          # earlier emit no branch data at all in the coveralls report.
          # 8.5 is the first release that reports both correctly.
          pip install 'gcovr>=8.5'
      - name: Check versions
        run: |
          g++ --version
          gcovr -v
          gcovr --gcov-executable "gcov --version"
      - name: Configure CMake
        run: >-
          cmake -S . -B build -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DCMAKE_CXX_FLAGS="--coverage" -G Ninja
      - name: CMake Build
        run: >-
          cmake --build build -j4
      - name: Run tests
        run: |
          ./build/sqd_tests
      - name: Convert to json for coveralls
        if: always()
        run: >-
          gcovr --coveralls coveralls.json --root .
          --exclude build
          --exclude deps
          --exclude benchmark
          --exclude-throw-branches
      - name: Test the reporting script
        run: python3 tools/test/test_untested_conditionals.py
      - name: Report untested conditionals
        if: always()
        run: |
          gcovr --json coverage.json --root . \
            --exclude build --exclude deps --exclude benchmark \
            --exclude-throw-branches
          python3 tools/untested-conditionals.py coverage.json --markdown \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coveralls.json
