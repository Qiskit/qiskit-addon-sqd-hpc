name: Development version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:
    name: development version tests (C++${{ matrix.cxx_standard }}, ${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            compiler: g++
            cxx_standard: 17
          - os: ubuntu-latest
            compiler: clang++
            cxx_standard: 20
          - os: ubuntu-latest
            compiler: g++
            cxx_standard: 23
          # GCC 16 is currently the only standard library shipping
          # std::philox_engine, so this is the row that actually exercises the
          # C++26 counter-based RNG path.
          - os: ubuntu-latest
            compiler: g++-16
            cxx_standard: 26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check out default branch of each submodule
        shell: bash
        run: |
          git submodule foreach git remote set-head origin -a
          git submodule foreach 'git checkout $(git rev-parse --abbrev-ref origin/HEAD)'
      - name: Enable Kitware ppa, which provides latest cmake
        if: runner.os == 'Linux'
        run: |
          # https://apt.kitware.com/
          test -f /usr/share/doc/kitware-archive-keyring/copyright || wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
      - name: Enable toolchain ppa for newer GCC (g++-16)
        if: matrix.compiler == 'g++-16'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang cmake ninja-build
          if [ "${{ matrix.compiler }}" = "g++-16" ]; then
            sudo apt-get install -y g++-16
          fi
      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON
          ${{ matrix.compiler != 'MSVC' && '-G Ninja' || '' }}
          ${{ matrix.compiler && format('-DCMAKE_CXX_COMPILER={0}', matrix.compiler) }}
          ${{ matrix.cxx_standard && format('-DCMAKE_CXX_STANDARD={0}', matrix.cxx_standard) }}
      - name: CMake Build
        run: >-
          cmake --build build -j4
          ${{ matrix.compiler == 'MSVC' && '--config Release' || '' }}
      - name: Copy build/Release/*.exe to build/ (MSVC)
        if: matrix.compiler == 'MSVC'
        run: |
          cp build/Release/*.exe build/
      - name: Run tests
        run: |
          ./build/sqd_tests
      - name: Run benchmarks
        run: |
          ./build/sqd_benchmarks

  # Build with OpenMP and run the tests at several thread counts, exercising the
  # parallel path of recover_configurations.  Uses g++-16 / C++26 so the
  # counter-based std::philox_engine path (and its thread-count-independence
  # test) is actually compiled and run.
  openmp-tests:
    name: OpenMP tests (C++26, g++-16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Enable Kitware ppa, which provides latest cmake
        run: |
          # https://apt.kitware.com/
          test -f /usr/share/doc/kitware-archive-keyring/copyright || wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
      - name: Enable toolchain ppa for newer GCC (g++-16)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-16 cmake ninja-build
      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON
          -DCMAKE_CXX_COMPILER=g++-16
          -DCMAKE_CXX_STANDARD=26
          -DSQD_ENABLE_OPENMP=ON
      - name: CMake Build
        run: cmake --build build -j4
      - name: Run tests at several thread counts
        run: |
          for nthreads in 1 2 4 8; do
            echo "== OMP_NUM_THREADS=$nthreads =="
            OMP_NUM_THREADS=$nthreads time ./build/sqd_tests
          done
