version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels: ["dependencies"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    labels: ["dependencies"]
    versioning-strategy: increase
    schedule:
      interval: "monthly"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    labels: ["dependencies"]
    schedule:
      interval: "weekly"
    groups:
      # The vendored Boost libraries are released together, so update them as
      # a single coordinated pull request rather than one per library.
      boost:
        patterns:
          - "deps/boost/*"
